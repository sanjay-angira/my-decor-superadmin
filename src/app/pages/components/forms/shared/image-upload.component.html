<div class="vr-upload">
  @if (value) {
    <div class="preview">
      @if (isVideo()) {
        <video [src]="value" controls></video>
      } @else {
        <img [src]="value" [alt]="label()" />
      }
      <p-button
        type="button"
        icon="pi pi-times"
        [rounded]="true"
        [text]="true"
        severity="secondary"
        (onClick)="clear()"
        ariaLabel="Remove"
      />
    </div>
  }
  <div class="vr-upload-dropzone-wrap">
    <span class="vr-upload-label"
      >{{ label() }}
      @if (required()) {
        <span class="req">*</span>
      }
    </span>
    <button
      class="vr-upload-dropzone"
      type="button"
      (click)="fileInput.click()"
      [disabled]="uploading() || disabled"
    >
      @if (uploading()) {
        <p-progressspinner [style]="{ width: '22px', height: '22px' }" />
      } @else {
        <i class="pi pi-cloud-upload" aria-hidden="true"></i>
        <span>{{ value ? 'Replace file' : 'Click to upload' }}</span>
      }
    </button>
  </div>
  @if (uploadError()) {
    <small class="upload-error">{{ uploadError() }}</small>
  }
  <input #fileInput type="file" hidden [accept]="accept()" (change)="onFile($event)" />
</div>
