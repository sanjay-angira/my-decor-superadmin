<div class="vr-page">
  <div class="vr-page-header-band">
    <div class="vr-title-card">
      <div class="vr-title-left">
        <h1>{{ title() }}</h1>
        <div class="vr-breadcrumbs">
          <a [routerLink]="['/admin', module()]">
            <i class="pi pi-home" aria-hidden="true"></i>
          </a>
          <span class="dot"></span>
          <a [routerLink]="['/admin', module()]">{{ module() }}</a>
          <span class="dot"></span>
          <span>{{ title() }}</span>
        </div>
      </div>
    </div>
  </div>

  <div class="vr-page-content vr-form-content">
    <div class="vr-card vr-form-body">
      @if (loading()) {
        <div class="center">
          <p-progressspinner [style]="{ width: '36px', height: '36px' }" />
          <p>Loading form...</p>
        </div>
      } @else if (loadError()) {
        <div class="error">
          <p>{{ loadError() }}</p>
          <p-button
            label="Back to list"
            icon="pi pi-arrow-left"
            severity="secondary"
            [outlined]="true"
            [routerLink]="['/admin', module()]"
          />
        </div>
      } @else {
        @if (submitError()) {
          <div class="error-banner">{{ submitError() }}</div>
        }
        <ng-content />
      }
    </div>
  </div>
</div>
