<app-admin-form-shell
  [title]="isEdit() ? 'Edit Brand' : 'Add Brand'"
  [module]="module()"
  [loading]="loading()"
  [loadError]="loadError()"
  [submitError]="submitError()"
>
  @if (isEdit() && recordId()) {
    <div class="warehouse-action">
      <a
        pButton
        [routerLink]="['/admin/brands', recordId(), 'warehouses']"
        [outlined]="true"
      >
        Manage Warehouses
      </a>
    </div>
  }
  <form [formGroup]="form" class="brand-form">
    <p-stepper [value]="1" [linear]="true">
      <p-step-list>
        <p-step [value]="1">Brand Details</p-step>
        <p-step [value]="2">Media Assets</p-step>
        <p-step [value]="3">SEO</p-step>
      </p-step-list>
      <p-step-panels>
        <p-step-panel [value]="1">
          <ng-template #content let-activateCallback="activateCallback">
            <div class="step-grid">
              <label class="prime-form-field">
                <span>Brand Name <span class="required">*</span></span>
                <input pInputText formControlName="brandName" />
                @if (form.controls.brandName.touched && form.controls.brandName.hasError('required')) {
                  <span class="field-error">Brand name is required</span>
                }
                @if (form.controls.brandName.hasError('minlength')) {
                  <span class="field-error">Brand name must be at least 5 characters</span>
                }
              </label>

              <label class="prime-form-field full">
                <span>Short Description <span class="required">*</span></span>
                <input pInputText formControlName="shortDescription" />
                @if (form.controls.shortDescription.touched && form.controls.shortDescription.hasError('required')) {
                  <span class="field-error">Short description is required</span>
                }
                @if (form.controls.shortDescription.hasError('minlength')) {
                  <span class="field-error">Short description must be at least 5 characters</span>
                }
              </label>

              <label class="prime-form-field">
                <span>Website</span>
                <input pInputText type="url" formControlName="website" placeholder="https://" />
                @if (form.controls.website.touched && form.controls.website.invalid) {
                  <span class="field-error">Enter a valid website URL beginning with http:// or https://</span>
                }
              </label>

              <label class="prime-form-field full">
                <span>Description <span class="required">*</span></span>
                <textarea pInputText rows="6" formControlName="description"></textarea>
                @if (form.controls.description.touched && form.controls.description.hasError('required')) {
                  <span class="field-error">Description is required</span>
                }
                @if (form.controls.description.hasError('minlength')) {
                  <span class="field-error">Description must be at least 5 characters</span>
                }
              </label>

              <label class="prime-form-field full">
                <span>Categories</span>
                <p-multiselect
                  [options]="categories()"
                  optionLabel="label"
                  optionValue="value"
                  formControlName="categoryIds"
                  display="chip"
                />
              </label>

              <label class="prime-form-field full">
                <span>Offers</span>
                <p-multiselect
                  [options]="offers()"
                  optionLabel="label"
                  optionValue="value"
                  formControlName="offerIds"
                  display="chip"
                />
              </label>

              <div class="toggle-row full">
                <div class="toggle-item">
                  <span>Active Status</span>
                  <p-toggleswitch formControlName="isActive" />
                  <span class="status-chip" [class.on]="form.controls.isActive.value">
                    {{ form.controls.isActive.value ? 'Active' : 'Not Active' }}
                  </span>
                </div>
              </div>
            </div>
            <div class="step-actions">
              <button pButton type="button" [disabled]="!isStepValid(1)" (click)="activateCallback(2)">
                Next
              </button>
            </div>
          </ng-template>
        </p-step-panel>

        <p-step-panel [value]="2">
          <ng-template #content let-activateCallback="activateCallback">
            <div class="media-grid">
              <app-image-upload
                class="full"
                label="Brand Logo"
                [path]="paths.logo"
                formControlName="logo"
              />
            </div>
            <div class="step-actions">
              <button pButton [outlined]="true" type="button" (click)="activateCallback(1)">
                Back
              </button>
              <button pButton type="button" (click)="activateCallback(3)">
                Next
              </button>
            </div>
          </ng-template>
        </p-step-panel>

        <p-step-panel [value]="3">
          <ng-template #content let-activateCallback="activateCallback">
            <div class="step-grid">
              <label class="prime-form-field full">
                <span>Meta Title <span class="required">*</span></span>
                <input pInputText formControlName="metaTitle" [maxlength]="metaTitleMax" />
                <small>{{ metaTitleLength() }}/{{ metaTitleMax }}</small>
                @if (form.controls.metaTitle.touched && form.controls.metaTitle.hasError('required')) {
                  <span class="field-error">Meta title is required</span>
                }
                @if (form.controls.metaTitle.hasError('minlength')) {
                  <span class="field-error">Meta title must be at least 5 characters</span>
                }
              </label>

              <label class="prime-form-field full">
                <span>Meta Description <span class="required">*</span></span>
                <textarea pInputText rows="3" formControlName="metaDescription" [maxlength]="metaDescMax"></textarea>
                <small>{{ metaDescLength() }}/{{ metaDescMax }}</small>
                @if (form.controls.metaDescription.touched && form.controls.metaDescription.hasError('required')) {
                  <span class="field-error">Meta description is required</span>
                }
                @if (form.controls.metaDescription.hasError('minlength')) {
                  <span class="field-error">Meta description must be at least 5 characters</span>
                }
              </label>

              <label class="prime-form-field full">
                <span>Meta Keywords</span>
                <input pInputText formControlName="metaKeywords" />
                <small>Separate keywords with commas</small>
              </label>
            </div>
            <div class="step-actions">
              <button pButton [outlined]="true" type="button" (click)="activateCallback(2)">
                Back
              </button>
              <button pButton type="button" [disabled]="saving() || !form.valid" (click)="submit()">
                {{ isEdit() ? 'Update Brand' : 'Create Brand' }}
              </button>
            </div>
          </ng-template>
        </p-step-panel>
      </p-step-panels>
    </p-stepper>
  </form>
</app-admin-form-shell>
