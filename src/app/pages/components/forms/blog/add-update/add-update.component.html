
<app-admin-form-shell
  [title]="isEdit() ? 'Edit Blog' : 'Add Blog'"
  [module]="module()"
  [loading]="loading()"
  [loadError]="loadError()"
  [submitError]="submitError()"
>
  <form [formGroup]="form" (ngSubmit)="submit()" class="vr-form">
    <label class="prime-form-field">
      <span>Title</span>
      <input pInputText formControlName="title" />
    </label>
    <label class="prime-form-field">
      <span>Slug</span>
      <input pInputText formControlName="slug" (input)="markSlugDirty()" />
    </label>
    <app-quill-editor label="Content" [required]="true" formControlName="content" />
    <label class="prime-form-field">
      <span>Excerpt</span>
      <textarea pInputText rows="3" formControlName="excerpt"></textarea>
    </label>
    <label class="prime-form-field">
      <span>Category</span>
      <p-select [options]="categories()" optionLabel="label" optionValue="value" formControlName="categoryId" />
    </label>
    <app-image-upload
      label="Blog Image"
      [path]="uploadPath"
      imageType="blog"
      [required]="true"
      formControlName="blogImage"
    />
    <label class="prime-form-field">
      <span>Image Alt Text</span>
      <input pInputText formControlName="blogImageAlt" />
    </label>
    <label class="prime-form-field">
      <span>Tags</span>
      <p-multiselect
        [options]="tags()"
        optionLabel="label"
        optionValue="value"
        formControlName="tagIds"
        display="chip"
      />
    </label>
    <label class="prime-form-field">
      <span>Status</span>
      <p-select
        [options]="[
          { label: 'Draft', value: 'draft' },
          { label: 'Published', value: 'published' },
          { label: 'Scheduled', value: 'scheduled' }
        ]"
        optionLabel="label"
        optionValue="value"
        formControlName="status"
      />
    </label>
    <label class="prime-form-toggle">
      <p-toggleswitch formControlName="isActive" />
      <span>Active</span>
    </label>
    <label class="prime-form-toggle">
      <p-checkbox formControlName="isFeatured" [binary]="true" />
      <span>Featured</span>
    </label>
    <label class="prime-form-field">
      <span>Meta Title</span>
      <input pInputText formControlName="metaTitle" />
    </label>
    <label class="prime-form-field">
      <span>Meta Description</span>
      <textarea pInputText rows="2" formControlName="metaDescription"></textarea>
    </label>
    <div class="actions">
      <button pButton type="submit" [disabled]="saving()">
        {{ isEdit() ? 'Update Blog' : 'Create Blog' }}
      </button>
      <a pButton [outlined]="true" [routerLink]="['/admin', module()]">Cancel</a>
    </div>
  </form>
</app-admin-form-shell>
