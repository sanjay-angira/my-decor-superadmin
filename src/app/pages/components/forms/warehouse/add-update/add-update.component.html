<app-admin-form-shell
  [title]="isEdit() ? 'Edit Warehouse' : 'Add Warehouse'"
  [module]="module()"
  [description]="'Warehouse dispatch and return address details'"
  [loading]="loading()"
  [loadError]="loadError()"
  [submitError]="submitError()"
>
  <form [formGroup]="form" class="vr-form">
    @if (isEdit()) {
      <section class="vr-form-section">
        <h2>Registration</h2>
        <p><strong>Status:</strong> {{ registrationStatus() || 'Unknown' }}</p>
        @if (registrationError()) {
          <p class="field-error">{{ registrationError() }}</p>
        }
        @if (canRetryRegistration) {
          <p-button
            type="button"
            label="Retry Delhivery registration"
            icon="pi pi-refresh"
            [loading]="retrying()"
            [disabled]="retrying()"
            (onClick)="retryRegistration()"
          />
        }
        @if (retryError()) {
          <p class="field-error">{{ retryError() }}</p>
        }
      </section>
    }

    <section class="vr-form-section">
      <h2>Warehouse Details</h2>
      <div class="vr-form-grid">
        <label class="form-field">
          Warehouse name *
          <input pInputText formControlName="name" [readonly]="providerFieldsLocked" />
        </label>
        <label class="form-field">
          Contact name *
          <input pInputText formControlName="contactName" [readonly]="providerFieldsLocked" />
        </label>
        <label class="form-field">
          Email *
          <input pInputText type="email" formControlName="email" [readonly]="providerFieldsLocked" />
        </label>
        <label class="form-field">
          Phone *
          <input pInputText formControlName="phone" [readonly]="providerFieldsLocked" />
        </label>
        <label class="form-field">
          Address line 1 *
          <input pInputText formControlName="addressLine1" [readonly]="providerFieldsLocked" />
        </label>
        <label class="form-field">
          Address line 2
          <input pInputText formControlName="addressLine2" [readonly]="providerFieldsLocked" />
        </label>
        <label class="form-field">
          City *
          <input pInputText formControlName="city" [readonly]="providerFieldsLocked" />
        </label>
        <label class="form-field">
          State *
          <input pInputText formControlName="state" [readonly]="providerFieldsLocked" />
        </label>
        <label class="form-field">
          Country *
          <input pInputText formControlName="country" [readonly]="providerFieldsLocked" />
        </label>
        <label class="form-field">
          PIN code *
          <input pInputText formControlName="pincode" [readonly]="providerFieldsLocked" />
        </label>
      </div>
    </section>

    <section class="vr-form-section">
      <h2>Return Address</h2>
      <div class="vr-form-grid">
        <label class="form-field">
          Registered name *
          <input pInputText formControlName="registeredName" [readonly]="providerFieldsLocked" />
        </label>
        <label class="form-field">
          Return address *
          <textarea pTextarea rows="3" formControlName="returnAddress" [readonly]="providerFieldsLocked"></textarea>
        </label>
        <label class="form-field">
          Return PIN code *
          <input pInputText formControlName="returnPin" [readonly]="providerFieldsLocked" />
        </label>
        <label class="form-field">
          Return city *
          <input pInputText formControlName="returnCity" [readonly]="providerFieldsLocked" />
        </label>
        <label class="form-field">
          Return state *
          <input pInputText formControlName="returnState" [readonly]="providerFieldsLocked" />
        </label>
        <label class="form-field">
          Return country *
          <input pInputText formControlName="returnCountry" [readonly]="providerFieldsLocked" />
        </label>
      </div>
    </section>

    <section class="vr-form-section">
      <h2>Availability</h2>
      <div class="vr-form-grid">
        <label class="form-field toggle-field">
          <p-toggleswitch formControlName="isActive" [disabled]="registrationStatus() === 'PENDING'" />
          <span>Active</span>
        </label>
        <label class="form-field toggle-field">
          <p-toggleswitch formControlName="isDefault" [disabled]="registrationStatus() === 'PENDING'" />
          <span>Default warehouse</span>
        </label>
      </div>
    </section>

    <div class="form-actions">
      <p-button
        type="button"
        label="Cancel"
        severity="secondary"
        [outlined]="true"
        [routerLink]="['/admin', module()]"
      />
      <p-button
        type="button"
        [label]="isEdit() ? 'Save changes' : 'Create warehouse'"
        icon="pi pi-check"
        [loading]="saving()"
        (onClick)="submit()"
      />
    </div>
  </form>
</app-admin-form-shell>
