<app-admin-form-shell
  [title]="isEdit() ? 'Edit Warehouse' : 'Add Warehouse'"
  [module]="module()"
  [description]="'Warehouse dispatch and return address details'"
  [loading]="loading()"
  [loadError]="loadError()"
  [submitError]="submitError()"
>
  <form [formGroup]="form" class="vr-form">
    @if (isEdit()) {
      <section class="vr-form-section full">
        <h2>Registration</h2>
        <p><strong>Status:</strong> {{ registrationStatus() || 'Unknown' }}</p>
        @if (registrationError()) {
          <p class="field-error">{{ registrationError() }}</p>
        }
        @if (canRetryRegistration) {
          <p-button
            type="button"
            label="Retry Delhivery registration"
            icon="pi pi-refresh"
            [loading]="retrying()"
            [disabled]="retrying()"
            (onClick)="retryRegistration()"
          />
        }
        @if (retryError()) {
          <p class="field-error">{{ retryError() }}</p>
        }
      </section>
    }

    <p-stepper class="full" [value]="1" [linear]="true">
      <p-step-list>
        <p-step [value]="1">Warehouse Details</p-step>
        <p-step [value]="2">Return Address</p-step>
        <p-step [value]="3">Availability</p-step>
      </p-step-list>
      <p-step-panels>
        <p-step-panel [value]="1">
          <ng-template #content let-activateCallback="activateCallback">
            <div class="vr-form-grid">
              <label class="prime-form-field">
                <span>Warehouse name <span class="required">*</span></span>
                <input pInputText formControlName="name" [readonly]="providerFieldsLocked" />
              </label>
              <label class="prime-form-field">
                <span>Contact name <span class="required">*</span></span>
                <input pInputText formControlName="contactName" [readonly]="providerFieldsLocked" />
              </label>
              <label class="prime-form-field">
                <span>Email <span class="required">*</span></span>
                <input pInputText type="email" formControlName="email" [readonly]="providerFieldsLocked" />
              </label>
              <label class="prime-form-field">
                <span>Phone <span class="required">*</span></span>
                <input pInputText formControlName="phone" [readonly]="providerFieldsLocked" />
              </label>
              <label class="prime-form-field">
                <span>Address line 1 <span class="required">*</span></span>
                <input pInputText formControlName="addressLine1" [readonly]="providerFieldsLocked" />
              </label>
              <label class="prime-form-field">
                <span>Address line 2</span>
                <input pInputText formControlName="addressLine2" [readonly]="providerFieldsLocked" />
              </label>
              <label class="prime-form-field">
                <span>City <span class="required">*</span></span>
                <input pInputText formControlName="city" [readonly]="providerFieldsLocked" />
              </label>
              <label class="prime-form-field">
                <span>State <span class="required">*</span></span>
                <input pInputText formControlName="state" [readonly]="providerFieldsLocked" />
              </label>
              <label class="prime-form-field">
                <span>Country <span class="required">*</span></span>
                <input pInputText formControlName="country" [readonly]="providerFieldsLocked" />
              </label>
              <label class="prime-form-field">
                <span>PIN code <span class="required">*</span></span>
                <input pInputText formControlName="pincode" [readonly]="providerFieldsLocked" />
              </label>
            </div>
            <div class="step-actions">
              <button pButton type="button" [disabled]="!isStepValid(1)" (click)="activateCallback(2)">
                Next
              </button>
            </div>
          </ng-template>
        </p-step-panel>

        <p-step-panel [value]="2">
          <ng-template #content let-activateCallback="activateCallback">
            <div class="vr-form-grid">
              <label class="prime-form-field">
                <span>Registered name <span class="required">*</span></span>
                <input pInputText formControlName="registeredName" [readonly]="providerFieldsLocked" />
              </label>
              <label class="prime-form-field">
                <span>Return address <span class="required">*</span></span>
                <textarea pTextarea rows="3" formControlName="returnAddress" [readonly]="providerFieldsLocked"></textarea>
              </label>
              <label class="prime-form-field">
                <span>Return PIN code <span class="required">*</span></span>
                <input pInputText formControlName="returnPin" [readonly]="providerFieldsLocked" />
              </label>
              <label class="prime-form-field">
                <span>Return city <span class="required">*</span></span>
                <input pInputText formControlName="returnCity" [readonly]="providerFieldsLocked" />
              </label>
              <label class="prime-form-field">
                <span>Return state <span class="required">*</span></span>
                <input pInputText formControlName="returnState" [readonly]="providerFieldsLocked" />
              </label>
              <label class="prime-form-field">
                <span>Return country <span class="required">*</span></span>
                <input pInputText formControlName="returnCountry" [readonly]="providerFieldsLocked" />
              </label>
            </div>
            <div class="step-actions">
              <button pButton [outlined]="true" type="button" (click)="activateCallback(1)">
                Back
              </button>
              <button pButton type="button" [disabled]="!isStepValid(2)" (click)="activateCallback(3)">
                Next
              </button>
            </div>
          </ng-template>
        </p-step-panel>

        <p-step-panel [value]="3">
          <ng-template #content let-activateCallback="activateCallback">
            <div class="vr-form-grid">
              <label class="prime-form-toggle">
                <p-toggleswitch formControlName="isActive" [disabled]="registrationStatus() === 'PENDING'" />
                <span>Active</span>
              </label>
              <label class="prime-form-toggle">
                <p-toggleswitch formControlName="isDefault" [disabled]="registrationStatus() === 'PENDING'" />
                <span>Default warehouse</span>
              </label>
            </div>
            <div class="step-actions">
              <button pButton [outlined]="true" type="button" (click)="activateCallback(2)">
                Back
              </button>
              <button pButton type="button" [disabled]="saving() || !form.valid" (click)="submit()">
                {{ isEdit() ? 'Save changes' : 'Create warehouse' }}
              </button>
            </div>
          </ng-template>
        </p-step-panel>
      </p-step-panels>
    </p-stepper>

  </form>
</app-admin-form-shell>
