
<app-admin-form-shell
  [title]="isEdit() ? 'Edit Blog Tag' : 'Add Blog Tag'"
  [module]="module()"
  [loading]="loading()"
  [loadError]="loadError()"
  [submitError]="submitError()"
>
  <form [formGroup]="form" (ngSubmit)="submit()" class="vr-form">
    <label class="prime-form-field">
      <span>Title</span>
      <input pInputText formControlName="title" />
    </label>
    <label class="prime-form-field">
      <span>Slug</span>
      <input pInputText formControlName="slug" (input)="markSlugDirty()" />
    </label>
    <label class="prime-form-toggle">
      <p-toggleswitch formControlName="isActive" />
      <span>Active</span>
    </label>
    <div class="actions">
      <button pButton type="submit" [disabled]="saving()">
        {{ isEdit() ? 'Update Tag' : 'Create Tag' }}
      </button>
      <a pButton [outlined]="true" [routerLink]="['/admin', module()]">Cancel</a>
    </div>
  </form>
</app-admin-form-shell>
