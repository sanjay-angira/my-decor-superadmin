<app-admin-form-shell [title]="isEdit() ? 'Edit Offer' : 'Add Offer'" [module]="module()" [loading]="loading()"
  [loadError]="loadError()" [submitError]="submitError()">
  <form [formGroup]="form" class="offer-form">
    <p-stepper [value]="1" [linear]="true">
      <p-step-list>
        <p-step [value]="1">Offer Details</p-step>
        <p-step [value]="2">Media Assets</p-step>
        <p-step [value]="3">Offer Settings</p-step>
      </p-step-list>
      <p-step-panels>
        <p-step-panel [value]="1">
          <ng-template #content let-activateCallback="activateCallback">
            <div class="step-grid">
              <label class="prime-form-field full">
                <span>Offer Name <span class="required">*</span></span>
                <input pInputText formControlName="offerName" />
                @if (form.controls.offerName.touched && form.controls.offerName.hasError('required')) {
                  <span class="field-error">Offer name is required</span>
                }
                @if (form.controls.offerName.hasError('minlength')) {
                  <span class="field-error">Offer name must be at least 2 characters</span>
                }
              </label>
              <label class="prime-form-field">
                <span>Discount Type <span class="required">*</span></span>
                <p-select [options]="[{ label: 'Percentage', value: 'percentage' }, { label: 'Fixed', value: 'fixed' }]"
                  optionLabel="label" optionValue="value" formControlName="discountType" />
              </label>
              <label class="prime-form-field">
                <span>Discount Value <span class="required">*</span></span>
                <input pInputText type="number" min="0.01" step="0.01" formControlName="discountValue" />
                @if (form.controls.discountValue.touched && form.controls.discountValue.hasError('min')) {
                  <span class="field-error">Discount value must be greater than 0</span>
                }
              </label>
              <div class="form-field full">
                <label class="prime-form-toggle">
                  <p-checkbox formControlName="timeBased" [binary]="true" />
                  <span>Time Based</span>
                </label>
              </div>
              @if (form.controls.timeBased.value) {
                <label class="prime-form-field">
                  <span>Start Date/Time <span class="required">*</span></span>
                  <p-datepicker
                    formControlName="startDateTime"
                    [showIcon]="true"
                    [showTime]="true"
                    [showButtonBar]="true"
                    hourFormat="24"
                    dateFormat="dd/mm/yy"
                    appendTo="body"
                  />
                  @if (form.controls.startDateTime.touched && form.controls.startDateTime.hasError('required')) {
                    <span class="field-error">Start date/time is required</span>
                  }
                </label>
                <label class="prime-form-field">
                  <span>End Date/Time <span class="required">*</span></span>
                  <p-datepicker
                    formControlName="endDateTime"
                    [showIcon]="true"
                    [showTime]="true"
                    [showButtonBar]="true"
                    hourFormat="24"
                    dateFormat="dd/mm/yy"
                    appendTo="body"
                  />
                  @if (form.controls.endDateTime.touched && form.controls.endDateTime.hasError('required')) {
                    <span class="field-error">End date/time is required</span>
                  }
                </label>
              }
            </div>
            <div class="step-actions">
              <button pButton type="button" [disabled]="!isStepValid(1)" (click)="activateCallback(2)">
                Next
              </button>
            </div>
          </ng-template>
        </p-step-panel>

        <p-step-panel [value]="2">
          <ng-template #content let-activateCallback="activateCallback">
            <div class="media-grid">
              <app-image-upload
                label="Desktop Offer Image (3:1, max 1920px)"
                [path]="uploadPath"
                imageType="offer_desktop"
                formControlName="desktopImage"
              />
              <app-image-upload
                label="Tablet Offer Image (2:1, max 1200px)"
                [path]="uploadPath"
                imageType="offer_tablet"
                formControlName="tabletImage"
              />
              <app-image-upload
                label="Mobile Offer Image (3:2, max 800px)"
                [path]="uploadPath"
                imageType="offer_mobile"
                formControlName="mobileImage"
              />
            </div>
            <div class="step-actions">
              <button pButton [outlined]="true" type="button" (click)="activateCallback(1)">
                Back
              </button>
              <button pButton type="button" (click)="activateCallback(3)">
                Next
              </button>
            </div>
          </ng-template>
        </p-step-panel>

        <p-step-panel [value]="3">
          <ng-template #content let-activateCallback="activateCallback">
            <div class="step-grid">
              <label class="prime-form-toggle">
                <p-toggleswitch formControlName="isActive" />
                <span>Active</span>
              </label>
              <label class="prime-form-toggle">
                <p-toggleswitch formControlName="useAsHeroBanner" />
                <span>Use as Hero Banner</span>
              </label>
            </div>
            <div class="step-actions">
              <button pButton [outlined]="true" type="button" (click)="activateCallback(2)">
                Back
              </button>
              <button pButton type="button" [disabled]="saving() || !form.valid" (click)="submit()">
                {{ isEdit() ? 'Update Offer' : 'Create Offer' }}
              </button>
            </div>
          </ng-template>
        </p-step-panel>
      </p-step-panels>
    </p-stepper>
  </form>
</app-admin-form-shell>
