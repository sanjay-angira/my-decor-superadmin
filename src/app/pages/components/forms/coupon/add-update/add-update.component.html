
<app-admin-form-shell
  [title]="isEdit() ? 'Edit Coupon' : 'Add Coupon'"
  [module]="module()"
  [loading]="loading()"
  [loadError]="loadError()"
  [submitError]="submitError()"
>
  <form [formGroup]="form" class="coupon-form">
    <p-stepper [value]="1" [linear]="true">
      <p-step-list>
        <p-step [value]="1">Coupon Details</p-step>
        <p-step [value]="2">Media Assets</p-step>
        <p-step [value]="3">Coupon Settings</p-step>
      </p-step-list>
      <p-step-panels>
        <p-step-panel [value]="1">
          <ng-template #content let-activateCallback="activateCallback">
            <div class="step-grid">
              <label class="prime-form-field full">
                <span>Coupon Code <span class="required">*</span></span>
                <input pInputText formControlName="couponCode" />
                @if (form.controls.couponCode.touched && form.controls.couponCode.hasError('required')) {
                  <span class="field-error">Coupon code is required</span>
                }
                @if (form.controls.couponCode.touched && form.controls.couponCode.hasError('minlength')) {
                  <span class="field-error">Coupon code must be at least 2 characters</span>
                }
              </label>
              <label class="prime-form-field">
                <span>Discount Type <span class="required">*</span></span>
                <p-select
                  [options]="[{ label: 'Percentage', value: 'percentage' }, { label: 'Fixed', value: 'fixed' }]"
                  optionLabel="label"
                  optionValue="value"
                  formControlName="discountType"
                />
              </label>
              <label class="prime-form-field">
                <span>Discount Value <span class="required">*</span></span>
                <input pInputText type="number" formControlName="discountValue" />
                @if (form.controls.discountValue.touched && form.controls.discountValue.hasError('required')) {
                  <span class="field-error">Discount value is required</span>
                }
              </label>
              <label class="prime-form-toggle full">
                <p-checkbox formControlName="timeBased" [binary]="true" />
                <span>Time Based</span>
              </label>
              @if (form.controls.timeBased.value) {
                <label class="prime-form-field">
                  <span>Start Date <span class="required">*</span></span>
                  <p-datepicker
                    formControlName="startDate"
                    [showIcon]="true"
                    [showButtonBar]="true"
                    dateFormat="dd/mm/yy"
                    appendTo="body"
                  />
                  @if (form.controls.startDate.touched && form.controls.startDate.hasError('required')) {
                    <span class="field-error">Start date is required</span>
                  }
                </label>
                <label class="prime-form-field">
                  <span>End Date <span class="required">*</span></span>
                  <p-datepicker
                    formControlName="endDate"
                    [showIcon]="true"
                    [showButtonBar]="true"
                    dateFormat="dd/mm/yy"
                    appendTo="body"
                  />
                  @if (form.controls.endDate.touched && form.controls.endDate.hasError('required')) {
                    <span class="field-error">End date is required</span>
                  }
                </label>
              }
            </div>
            <div class="step-actions">
              <button pButton type="button" [disabled]="!isStepValid(1)" (click)="activateCallback(2)">
                Next
              </button>
            </div>
          </ng-template>
        </p-step-panel>

        <p-step-panel [value]="2">
          <ng-template #content let-activateCallback="activateCallback">
            <div class="media-grid">
              <app-image-upload label="Coupon Image" [path]="uploadPath" formControlName="image" />
            </div>
            <div class="step-actions">
              <button pButton [outlined]="true" type="button" (click)="activateCallback(1)">
                Back
              </button>
              <button pButton type="button" (click)="activateCallback(3)">
                Next
              </button>
            </div>
          </ng-template>
        </p-step-panel>

        <p-step-panel [value]="3">
          <ng-template #content let-activateCallback="activateCallback">
            <div class="step-grid">
              <label class="prime-form-toggle">
                <p-toggleswitch formControlName="isActive" />
                <span>Active</span>
              </label>
              <label class="prime-form-toggle">
                <p-checkbox formControlName="isUserSpecific" [binary]="true" />
                <span>User Specific</span>
              </label>
              @if (form.controls.isUserSpecific.value) {
                <label class="prime-form-field full">
                  <span>Users</span>
                  <p-multiselect
                    [options]="users()"
                    optionLabel="label"
                    optionValue="value"
                    formControlName="userIds"
                    display="chip"
                  />
                </label>
              }
            </div>
            <div class="step-actions">
              <button pButton [outlined]="true" type="button" (click)="activateCallback(2)">
                Back
              </button>
              <button pButton type="button" [disabled]="saving() || !form.valid" (click)="submit()">
                {{ isEdit() ? 'Update Coupon' : 'Create Coupon' }}
              </button>
            </div>
          </ng-template>
        </p-step-panel>
      </p-step-panels>
    </p-stepper>
  </form>
</app-admin-form-shell>
