
<app-admin-form-shell
  [title]="isEdit() ? 'Edit Coupon' : 'Add Coupon'"
  [module]="module()"
  [loading]="loading()"
  [loadError]="loadError()"
  [submitError]="submitError()"
>
  <form [formGroup]="form" (ngSubmit)="submit()" class="vr-form">
    <label class="prime-form-field">
      <span>Coupon Code</span>
      <input pInputText formControlName="couponCode" />
    </label>
    <app-image-upload label="Coupon Image" [path]="uploadPath" formControlName="image" />
    <label class="prime-form-field">
      <span>Discount Type</span>
      <p-select
        [options]="[{ label: 'Percentage', value: 'percentage' }, { label: 'Fixed', value: 'fixed' }]"
        optionLabel="label"
        optionValue="value"
        formControlName="discountType"
      />
    </label>
    <label class="prime-form-field">
      <span>Discount Value</span>
      <input pInputText type="number" formControlName="discountValue" />
    </label>
    <label class="prime-form-field">
      <span>Start Date</span>
      <input pInputText type="date" formControlName="startDate" />
    </label>
    <label class="prime-form-field">
      <span>End Date</span>
      <input pInputText type="date" formControlName="endDate" />
    </label>
    <label class="prime-form-toggle">
      <p-toggleswitch formControlName="isActive" />
      <span>Active</span>
    </label>
    <label class="prime-form-toggle">
      <p-checkbox formControlName="isUserSpecific" [binary]="true" />
      <span>User Specific</span>
    </label>
    @if (form.controls.isUserSpecific.value) {
      <label class="prime-form-field">
        <span>Users</span>
        <p-multiselect
          [options]="users()"
          optionLabel="label"
          optionValue="value"
          formControlName="userIds"
          display="chip"
        />
      </label>
    }
    <div class="actions">
      <button pButton type="submit" [disabled]="saving()">
        {{ isEdit() ? 'Update Coupon' : 'Create Coupon' }}
      </button>
      <a pButton [outlined]="true" [routerLink]="['/admin', module()]">Cancel</a>
    </div>
  </form>
</app-admin-form-shell>
